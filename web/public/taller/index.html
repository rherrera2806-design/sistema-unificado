<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taller - Piso de Producción</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(15,23,42,0.3);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .user-info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .station-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }
        .station-card:active {
            transform: scale(0.98);
        }
        .station-card .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .station-card .station-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .station-card .station-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .station-card .station-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .station-card .stat {
            text-align: center;
            padding: 8px;
            background: var(--bg);
            border-radius: 10px;
        }
        .station-card .stat-value {
            font-size: 20px;
            font-weight: 800;
            line-height: 1;
        }
        .station-card .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .queue-list {
            margin-top: 16px;
        }
        .queue-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease;
        }
        .queue-item.en-proceso {
            border-left-color: var(--warning);
            background: #fffbeb;
        }
        .queue-item .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .queue-item .item-title {
            font-size: 14px;
            font-weight: 700;
        }
        .queue-item .item-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }
        .queue-item .item-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .queue-item .detail {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .queue-item .detail-label {
            color: var(--text-muted);
        }
        .queue-item .detail-value {
            font-weight: 600;
        }
        .queue-item .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .priority-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }
        .priority-1 { background: var(--success); }
        .priority-2 { background: var(--warning); }
        .priority-3 { background: var(--danger); }
        .priority-4 { background: var(--purple); }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-pendiente { background: #dbeafe; color: #1e40af; }
        .status-en-proceso { background: #fef3c7; color: #92400e; }
        .status-terminado { background: #dcfce7; color: #166534; }
        .status-pausado { background: #fef2f2; color: #991b1b; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            border-radius: 20px 20px 0 0;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-body {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .defecto-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .defecto-chip {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .defecto-chip.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
        }
        .timer {
            font-size: 24px;
            font-weight: 800;
            font-family: monospace;
            color: var(--warning);
            text-align: center;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="headerContent">
            <h1>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                </svg>
                Taller
            </h1>
            <div class="user-info" id="userInfo">Operario</div>
        </div>
    </div>

    <div class="container" id="app">
        <div class="loading">Cargando estaciones...</div>
    </div>

    <!-- Modal de Detalle de Paso -->
    <div class="modal-overlay" id="pasoModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="pasoModalTitle">Detalle del Paso</h3>
                <button class="modal-close" onclick="closePasoModal()">&times;</button>
            </div>
            <div class="modal-body" id="pasoModalBody"></div>
        </div>
    </div>

    <!-- Modal de Inspección -->
    <div class="modal-overlay" id="inspeccionModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Inspección de Calidad</h3>
                <button class="modal-close" onclick="closeInspeccionModal()">&times;</button>
            </div>
            <div class="modal-body" id="inspeccionModalBody"></div>
        </div>
    </div>

    <script>
        const API = '/api/taller';
        let currentUser = JSON.parse(localStorage.getItem('unified_user') || '{}');
        let currentView = 'estaciones';
        let currentEstacion = null;
        let timerInterval = null;
        let timerSeconds = 0;

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('userInfo').textContent = currentUser.email || 'Operario';
            loadEstaciones();
        });

        // ============ VISTAS ============

        async function loadEstaciones() {
            currentView = 'estaciones';
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading">Cargando estaciones...</div>';

            try {
                const res = await fetch(`${API}/estaciones`, { headers: getHeaders() });
                const estaciones = await res.json();

                let html = '<div style="margin-bottom:16px"><h2 style="font-size:16px;font-weight:700;color:var(--text)">Selecciona una Estación</h2><p style="font-size:12px;color:var(--text-muted)">Elige la estación donde vas a trabajar</p></div>';

                estaciones.forEach(e => {
                    const carga = e.pendientes + e.en_proceso;
                    const cargaColor = carga > 10 ? 'var(--danger)' : carga > 5 ? 'var(--warning)' : 'var(--success)';
                    html += `
                        <div class="station-card" onclick="showMaquinaModal(${e.id}, '${e.nombre_estacion}')">
                            <div class="station-header">
                                <div class="station-name">${e.nombre_estacion}</div>
                                <div class="station-badge" style="background:${cargaColor}20;color:${cargaColor}">${carga} en cola</div>
                            </div>
                            <div class="station-stats">
                                <div class="stat">
                                    <div class="stat-value" style="color:var(--primary)">${e.pendientes}</div>
                                    <div class="stat-label">Pendientes</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value" style="color:var(--warning)">${e.en_proceso}</div>
                                    <div class="stat-label">En Proceso</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value" style="color:var(--text)">${e.total_kilos ? Math.round(e.total_kilos) : 0}</div>
                                    <div class="stat-label">Kilos</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                app.innerHTML = html;
            } catch (err) {
                app.innerHTML = '<div class="empty-state"><p>Error al cargar estaciones</p></div>';
            }
        }

        async function showMaquinaModal(estacionId, estacionNombre) {
            const modal = document.getElementById('pasoModal');
            document.getElementById('pasoModalTitle').textContent = 'Seleccionar Máquina';
            document.getElementById('pasoModalBody').innerHTML = '<div class="loading">Cargando máquinas...</div>';
            modal.classList.add('active');

            try {
                const res = await fetch(`${API}/maquinas/${estacionId}`, { headers: getHeaders() });
                const maquinas = await res.json();

                if (maquinas.length === 0) {
                    document.getElementById('pasoModalBody').innerHTML = `
                        <div style="text-align:center;padding:20px">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom:12px">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="15" y1="9" x2="9" y2="15"/>
                                <line x1="9" y1="9" x2="15" y2="15"/>
                            </svg>
                            <p style="color:var(--text-muted);margin-bottom:16px">No hay máquinas configuradas para esta estación</p>
                            <div style="display:flex;gap:10px;justify-content:center">
                                <button class="btn btn-outline" onclick="closePasoModal()">Cancelar</button>
                                <button class="btn btn-primary" onclick="closePasoModal(); loadCola(${estacionId}, '${estacionNombre}', null)">Continuar sin máquina</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                document.getElementById('pasoModalBody').innerHTML = `
                    <div style="margin-bottom:16px">
                        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Selecciona la máquina que vas a usar en <strong>${estacionNombre}</strong></p>
                        <div id="maquinasList" style="display:flex;flex-direction:column;gap:8px">
                            ${maquinas.map(m => `
                                <div class="maquina-option" data-id="${m.id}" data-nombre="${m.nombre}" onclick="selectMaquina(this)" style="
                                    background:var(--bg);
                                    border:2px solid var(--border);
                                    border-radius:12px;
                                    padding:14px;
                                    cursor:pointer;
                                    transition:all 0.2s;
                                ">
                                    <div style="display:flex;justify-content:space-between;align-items:center">
                                        <div>
                                            <div style="font-weight:700;font-size:14px">${m.nombre}</div>
                                            <div style="font-size:12px;color:var(--text-muted)">${m.codigo || 'Sin código'}</div>
                                        </div>
                                        <div style="text-align:right">
                                            <div style="font-size:11px;padding:3px 8px;border-radius:10px;background:${m.estado === 'ACTIVA' ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)'};color:${m.estado === 'ACTIVA' ? 'var(--success)' : 'var(--danger)'}">${m.estado}</div>
                                            ${m.capacidad_max_m2_dia ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px">${m.capacidad_max_m2_dia} m²/día</div>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
                        <button class="btn btn-outline" onclick="closePasoModal()">Cancelar</button>
                        <button class="btn btn-primary" id="btnConfirmMaquina" onclick="confirmMaquina(${estacionId}, '${estacionNombre}')" disabled style="opacity:0.5">Continuar</button>
                    </div>
                `;
            } catch (err) {
                document.getElementById('pasoModalBody').innerHTML = `
                    <div style="text-align:center;padding:20px">
                        <p style="color:var(--danger)">Error al cargar máquinas</p>
                        <button class="btn btn-outline" onclick="closePasoModal()" style="margin-top:12px">Cerrar</button>
                    </div>
                `;
            }
        }

        let selectedMaquina = null;

        function selectMaquina(element) {
            document.querySelectorAll('.maquina-option').forEach(el => {
                el.style.borderColor = 'var(--border)';
                el.style.background = 'var(--bg)';
            });
            element.style.borderColor = 'var(--primary)';
            element.style.background = 'rgba(59,130,246,0.1)';
            
            selectedMaquina = {
                id: Number(element.dataset.id),
                nombre: element.dataset.nombre
            };

            const btn = document.getElementById('btnConfirmMaquina');
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        function confirmMaquina(estacionId, estacionNombre) {
            if (!selectedMaquina) return;
            closePasoModal();
            loadCola(estacionId, estacionNombre, selectedMaquina);
            selectedMaquina = null;
        }

        let colaActual = [];
        let filtroPedido = '';
        let filtroEspesor = '';
        let searchTimer = null;

        function onSearchInput(value) {
            filtroPedido = value;
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => renderCola(), 250);
        }

        function onEspesorChange(value) {
            filtroEspesor = value;
            renderCola();
        }

        async function loadCola(estacionId, estacionNombre, maquina) {
            currentView = 'cola';
            currentEstacion = { id: estacionId, nombre: estacionNombre, maquina: maquina };
            colaActual = [];
            filtroPedido = '';
            filtroEspesor = '';
            renderCola();
            cargarCola();
        }

        async function cargarCola() {
            const app = document.getElementById('app');
            if (colaActual.length === 0) {
                app.innerHTML = '<div class="loading">Cargando cola de trabajo...</div>';
            }
            try {
                const res = await fetch(`${API}/colaxestacion/${currentEstacion.id}`, { headers: getHeaders() });
                colaActual = await res.json();
                renderCola();
            } catch (err) {
                app.innerHTML = '<div class="empty-state"><p>Error al cargar cola</p></div>';
            }
        }

        function renderCola() {
            const app = document.getElementById('app');
            const maquina = currentEstacion.maquina;
            const estacionNombre = currentEstacion.nombre;
            const searchEl = document.getElementById('searchPedido');
            const searchFocus = searchEl && document.activeElement === searchEl;
            const cursorPos = searchEl ? searchEl.selectionStart : null;

            let html = `
                <div style="margin-bottom:16px">
                    <button class="back-btn" onclick="loadEstaciones()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        Volver
                    </button>
                    <h2 style="font-size:16px;font-weight:700;color:var(--text);margin-top:8px">${estacionNombre}</h2>
                    <p style="font-size:12px;color:var(--text-muted)">${colaActual.length} trabajos en cola</p>
                </div>
            `;

            if (maquina) {
                html += `
                    <div style="background:linear-gradient(135deg,rgba(59,130,246,0.1),rgba(139,92,246,0.1));border:1px solid rgba(59,130,246,0.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                        </svg>
                        <div>
                            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px">Máquina asignada</div>
                            <div style="font-size:14px;font-weight:700;color:var(--primary)">${maquina.nombre}</div>
                        </div>
                        <button onclick="loadEstaciones()" style="margin-left:auto;background:rgba(239,68,68,0.1);border:none;color:var(--danger);padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer">Cambiar</button>
                    </div>
                `;
            }

            html += `
                <div style="margin-bottom:10px;position:relative">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchPedido" placeholder="Buscar por pedido..." value="${filtroPedido}" oninput="onSearchInput(this.value)" style="width:100%;padding:12px 12px 12px 38px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--card)">
                </div>
            `;

            const espesoresDisponibles = [...new Set(colaActual.map(it => it.espesor_mm).filter(e => e != null))].sort((a, b) => a - b);
            if (espesoresDisponibles.length > 0) {
                html += `
                    <div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
                        <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Espesor:</span>
                        <button onclick="onEspesorChange('')" style="padding:5px 12px;border-radius:16px;border:1px solid ${!filtroEspesor ? 'var(--primary)' : 'var(--border)'};background:${!filtroEspesor ? 'var(--primary)' : 'transparent'};color:${!filtroEspesor ? 'white' : 'var(--text)'};font-size:12px;font-weight:600;cursor:pointer">Todos</button>
                        ${espesoresDisponibles.map(e => `
                            <button onclick="onEspesorChange('${e}')" style="padding:5px 12px;border-radius:16px;border:1px solid ${filtroEspesor == e ? 'var(--primary)' : 'var(--border)'};background:${filtroEspesor == e ? 'var(--primary)' : 'transparent'};color:${filtroEspesor == e ? 'white' : 'var(--text)'};font-size:12px;font-weight:600;cursor:pointer">${e}mm</button>
                        `).join('')}
                    </div>
                `;
            }

            const colaFiltrada = colaActual.filter(it => {
                if (filtroPedido && !String(it.pedido_sap_id || '').toLowerCase().includes(filtroPedido.toLowerCase())) return false;
                if (filtroEspesor && String(it.espesor_mm) !== String(filtroEspesor)) return false;
                return true;
            });

            if (filtroPedido && colaFiltrada.length > 0) {
                const ordenId = colaFiltrada[0].orden_id;
                const todosPendientes = colaFiltrada.every(it => it.estado === 'PENDIENTE');
                if (todosPendientes) {
                    html += `
                        <button class="btn btn-success btn-block" onclick="iniciarTodas(${ordenId})" style="margin-bottom:14px">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Iniciar todas (${colaFiltrada.length})
                        </button>
                    `;
                }
            }

            if (colaFiltrada.length === 0) {
                html += `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <p>${filtroPedido ? 'No hay coincidencias para ese pedido' : 'No hay trabajos en esta estación'}</p>
                    </div>
                `;
            } else {
                colaFiltrada.forEach(item => {
                    const isEnProceso = item.estado === 'EN_PROCESO';
                    const prioridadClass = `priority-${item.nivel_prioridad || 1}`;
                    const prioridadLabel = ['', 'Normal', 'Express', 'Urgencia', 'Reposicion'][item.nivel_prioridad || 1];

                    html += `
                        <div class="queue-item ${isEnProceso ? 'en-proceso' : ''}">
                            <div class="item-header">
                                <div style="display:flex;flex-direction:column;gap:4px">
                                    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
                                        <span style="font-size:13px;font-weight:600"><span style="color:var(--text-muted);font-weight:500">Pedido:</span> <strong>${item.pedido_sap_id || '-'}</strong></span>
                                        <span style="font-size:13px;font-weight:600"><span style="color:var(--text-muted);font-weight:500">Item:</span> <strong>${item.item_numero != null ? item.item_numero : '-'}</strong></span>
                                    </div>
                                    <div style="font-size:12px;color:var(--text-muted)">${item.cliente || 'Sin cliente'}</div>
                                </div>
                                <div style="display:flex;gap:6px;align-items:center">
                                    <span class="priority-badge ${prioridadClass}">${prioridadLabel}</span>
                                    <span class="status-badge status-${item.estado.toLowerCase().replace('_', '-')}">${item.estado}</span>
                                </div>
                            </div>
                            <div style="font-size:15px;font-weight:700;margin:8px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline">
                                <span>${item.codigo_producto || '-'}</span>
                                <span style="font-size:13px;font-weight:500;color:var(--text-muted)">${item.descripcion || ''}${item.espesor_mm ? ' • ' + item.espesor_mm + 'mm' : ''}</span>
                            </div>
                            <div class="item-details">
                                <div class="detail">
                                    <span class="detail-label">Cantidad:</span>
                                    <span class="detail-value">${item.cantidad || 1}</span>
                                </div>
                                <div class="detail">
                                    <span class="detail-label">Dimensiones:</span>
                                    <span class="detail-value">${item.ancho}x${item.alto}mm</span>
                                </div>
                                <div class="detail">
                                    <span class="detail-label">Kilos:</span>
                                    <span class="detail-value">${item.kilos ? Math.round(item.kilos) : '-'}</span>
                                </div>
                            </div>
                            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:8px;font-size:11px">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                                <span style="color:var(--text-muted)">Paso ${item.orden_secuencia}:</span>
                                <strong>${item.estacion_actual || '-'}</strong>
                                ${item.proxima_estacion ? `
                                    <span style="color:var(--text-muted);margin-left:6px">→</span>
                                    <strong style="color:var(--primary)">${item.proxima_estacion}</strong>
                                ` : `<span style="color:var(--success);margin-left:6px;font-weight:600">(último paso)</span>`}
                            </div>
                            <div class="item-actions">
                                ${isEnProceso ? `
                                    <button class="btn btn-warning btn-sm" onclick="pausarPaso(${item.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                        Pausar
                                    </button>
                                    <button class="btn btn-success btn-sm" onclick="showFinalizarModal(${item.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                                        Finalizar
                                    </button>
                                    <button class="btn btn-outline btn-sm" onclick="showInspeccionModal(${item.id}, ${item.orden_id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                        Inspeccionar
                                    </button>
                                ` : item.estado === 'PAUSADO' ? `
                                    <button class="btn btn-primary btn-sm" onclick="reanudarPaso(${item.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        Reanudar
                                    </button>
                                ` : `
                                    <button class="btn btn-primary btn-sm" onclick="iniciarPaso(${item.id})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        Iniciar
                                    </button>
                                    <button class="btn btn-outline btn-sm" onclick="showProcesarModal(${item.id}, ${item.cantidad || 1})">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                                        Procesar
                                    </button>
                                `}
                                <button class="btn btn-danger btn-sm" onclick="showMermaModal(${item.id})">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                    Merma
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            app.innerHTML = html;

            if (searchFocus) {
                const newSearch = document.getElementById('searchPedido');
                if (newSearch) {
                    newSearch.focus();
                    if (cursorPos !== null) newSearch.setSelectionRange(cursorPos, cursorPos);
                }
            }
        }

        async function iniciarTodas(ordenId) {
            try {
                const maquinaId = currentEstacion.maquina?.id || null;
                const estacionId = currentEstacion.id;
                const res = await fetch(`${API}/iniciar-pedido`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        orden_id: ordenId,
                        estacion_id: estacionId,
                        maquina_id: maquinaId,
                        operario_nombre: currentUser.nombre || currentUser.email
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast(`${data.iniciados} pasos iniciados`, 'success');
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al iniciar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        // ============ ACCIONES ============

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-User-Email': currentUser.email || '',
                'X-User-Permisos': (currentUser.permisos || []).join(',')
            };
        }

        async function iniciarPaso(pasoId) {
            try {
                const maquinaId = currentEstacion.maquina?.id || null;
                const res = await fetch(`${API}/iniciar`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ 
                        paso_id: pasoId, 
                        maquina_id: maquinaId,
                        operario_nombre: currentUser.nombre || currentUser.email 
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('Paso iniciado', 'success');
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al iniciar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        async function pausarPaso(pasoId) {
            try {
                const res = await fetch(`${API}/pausar`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ paso_id: pasoId })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('Paso pausado', 'warning');
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al pausar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        async function reanudarPaso(pasoId) {
            try {
                const res = await fetch(`${API}/reanudar`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ paso_id: pasoId })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('Paso reanudado', 'success');
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al reanudar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        async function finalizarPaso(pasoId) {
            try {
                const res = await fetch(`${API}/finalizar`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ paso_id: pasoId })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('Paso finalizado', 'success');
                    closePasoModal();
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al finalizar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        async function procesarPaso(pasoId, cantidad) {
            try {
                const maquinaId = currentEstacion.maquina?.id || null;
                const res = await fetch(`${API}/procesar`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ 
                        paso_id: pasoId, 
                        cantidad: Number(cantidad),
                        maquina_id: maquinaId
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast(`Procesadas: ${data.cantidadProcesar}`, 'success');
                    closePasoModal();
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al procesar', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        async function registrarMerma(pasoId, causa, cantidad, observacion) {
            try {
                const res = await fetch(`${API}/merma`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ paso_id: pasoId, causa, cantidad, observacion })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.mensaje || 'Merma registrada', 'warning');
                    closePasoModal();
                    cargarCola();
                } else {
                    showToast(data.error || 'Error al registrar merma', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        // ============ MODALES ============

        function showFinalizarModal(pasoId) {
            const modal = document.getElementById('pasoModal');
            document.getElementById('pasoModalTitle').textContent = 'Finalizar Paso';
            document.getElementById('pasoModalBody').innerHTML = `
                <div style="text-align:center;padding:20px 0">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" style="margin-bottom:12px">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <h3 style="margin-bottom:8px">¿Finalizar este paso?</h3>
                    <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px">Esto marcará el paso como terminado y habilitará el siguiente.</p>
                    <div style="display:flex;gap:10px;justify-content:center">
                        <button class="btn btn-outline" onclick="closePasoModal()">Cancelar</button>
                        <button class="btn btn-success" onclick="finalizarPaso(${pasoId})">Finalizar</button>
                    </div>
                </div>
            `;
            modal.classList.add('active');
        }

        function showProcesarModal(pasoId, cantidadMax) {
            const modal = document.getElementById('pasoModal');
            document.getElementById('pasoModalTitle').textContent = 'Procesar Cantidad';
            document.getElementById('pasoModalBody').innerHTML = `
                <div class="form-group">
                    <label>Cantidad a procesar</label>
                    <input type="number" class="form-control" id="procesarCantidad" value="${cantidadMax}" min="1" max="${cantidadMax}">
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px">Máximo: ${cantidadMax} unidades</p>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn btn-outline" onclick="closePasoModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="procesarPaso(${pasoId}, document.getElementById('procesarCantidad').value)">Procesar</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function showMermaModal(pasoId) {
            const modal = document.getElementById('pasoModal');
            document.getElementById('pasoModalTitle').textContent = 'Registrar Merma';
            document.getElementById('pasoModalBody').innerHTML = `
                <div class="form-group">
                    <label>Causa de la merma</label>
                    <select class="form-control" id="mermaCausa">
                        <option value="Rayón">Rayón</option>
                        <option value="Quiebre">Quiebre</option>
                        <option value="Defecto de templado">Defecto de templado</option>
                        <option value="Defecto de pintado">Defecto de pintado</option>
                        <option value="Fuera de dimensión">Fuera de dimensión</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" class="form-control" id="mermaCantidad" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Observación</label>
                    <textarea class="form-control" id="mermaObservacion" rows="3" placeholder="Detalles de la merma..."></textarea>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn btn-outline" onclick="closePasoModal()">Cancelar</button>
                    <button class="btn btn-danger" onclick="registrarMerma(${pasoId}, document.getElementById('mermaCausa').value, document.getElementById('mermaCantidad').value, document.getElementById('mermaObservacion').value)">Registrar Merma</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function showInspeccionModal(pasoId, ordenId) {
            const modal = document.getElementById('inspeccionModal');
            document.getElementById('inspeccionModalBody').innerHTML = `
                <div class="form-group">
                    <label>Tipo de Inspección</label>
                    <select class="form-control" id="inspTipo">
                        <option value="proceso">En Proceso</option>
                        <option value="final">Final</option>
                        <option value="aleatoria">Aleatoria</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resultado</label>
                    <select class="form-control" id="inspResultado">
                        <option value="aprobado">Aprobado</option>
                        <option value="rechazado">Rechazado</option>
                        <option value="condicional">Condicional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad Inspeccionada</label>
                    <input type="number" class="form-control" id="inspCantidad" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Cantidad Defectuosa</label>
                    <input type="number" class="form-control" id="inspDefectuosos" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea class="form-control" id="inspObs" rows="3" placeholder="Detalles de la inspección..."></textarea>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn btn-outline" onclick="closeInspeccionModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="crearInspeccion(${pasoId}, ${ordenId})">Guardar Inspección</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function closePasoModal() {
            document.getElementById('pasoModal').classList.remove('active');
        }

        function closeInspeccionModal() {
            document.getElementById('inspeccionModal').classList.remove('active');
        }

        async function crearInspeccion(pasoId, ordenId) {
            try {
                const res = await fetch('/api/taller/inspecciones', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        paso_id: pasoId,
                        orden_produccion_id: ordenId,
                        estacion_id: currentEstacion.id,
                        tipo_inspeccion: document.getElementById('inspTipo').value,
                        resultado: document.getElementById('inspResultado').value,
                        cantidad_inspeccionada: Number(document.getElementById('inspCantidad').value),
                        cantidad_defectuosa: Number(document.getElementById('inspDefectuosos').value),
                        observaciones: document.getElementById('inspObs').value
                    })
                });
                const data = await res.json();
                if (data.id) {
                    showToast('Inspección registrada', 'success');
                    closeInspeccionModal();
                } else {
                    showToast('Error al registrar inspección', 'error');
                }
            } catch (err) {
                showToast('Error de conexión', 'error');
            }
        }

        // ============ TOAST ============

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
                padding: 12px 24px; border-radius: 12px; color: white; font-size: 14px; font-weight: 600;
                z-index: 2000; animation: fadeIn 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
                max-width: 90%; text-align: center;
            `;
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--primary)' };
            toast.style.background = colors[type] || colors.info;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
